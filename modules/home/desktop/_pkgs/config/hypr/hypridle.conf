# =============================================================================
# Hypridle Configuration
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# =============================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock                     
    before_sleep_cmd = loginctl lock-session                  
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms(true)"
}

# 2.5 min: Dim display backlight to save power
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 min: Lock screen
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: Turn off display
listener {
    timeout = 330
    on-timeout = hyprctl dispatch "hl.dsp.dpms(false)"
    on-resume = hyprctl dispatch "hl.dsp.dpms(true)"
}

# 15 min: Suspend system to RAM (fast resume, transitions to hibernate after 1h)
listener {
    timeout = 900
    on-timeout = systemctl suspend-then-hibernate
}

# 1 hour: Hibernate system if left inactive for too long
listener {
    timeout = 3600
    on-timeout = systemctl hibernate
}
