# =============================================================================
# Hyprlock Configuration - Base16 Monochromatic Brutalist
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# =============================================================================

# General settings
general {
    hide_cursor         = false
    immediate_render    = true
    ignore_empty_input  = true
}

# Background (blurred capture of desktop)
background {
    monitor     =
    path        = screenshot
    blur_passes = 3
    blur_size   = 8
    noise       = 0.0117
    contrast    = 0.8916
    brightness  = 0.75
    vibrancy    = 0.1696
    color       = rgba(24, 24, 24, 1.0)
}

# Time (Large Digital Clock) - Menggunakan native variable $TIME
label {
    monitor     =
    text        = $TIME
    color       = rgb(238, 238, 238)
    font_size   = 84
    font_family = Iosevka Nerd Font Mono Bold
    position    = 0, 140
    halign      = center
    valign      = center
}

# Date Label - Update setiap 1 menit (60000ms) untuk hemat daya
label {
    monitor     =
    text        = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    color       = rgb(168, 168, 168)
    font_size   = 16
    font_family = Iosevka Nerd Font Mono
    position    = 0, 60
    halign      = center
    valign      = center
}

# Username Indicator
label {
    monitor     =
    text        =   $USER
    color       = rgb(184, 184, 184)
    font_size   = 13
    font_family = Iosevka Nerd Font Mono
    position    = 0, -15
    halign      = center
    valign      = center
}

# Password Input Field
input-field {
    monitor             =
    size                = 280, 48
    outline_thickness   = 1
    dots_size           = 0.22
    dots_spacing        = 0.25
    dots_center         = true
    rounding            = 0

    font_color          = rgb(216, 216, 216)
    inner_color         = rgba(24, 24, 24, 0.85)
    outer_color         = rgba(255, 255, 255, 0.40)
    check_color         = rgb(255, 255, 255)
    fail_color          = rgb(171, 70, 66)

    fade_on_empty       = false
    placeholder_text    = <span foreground="##787878">Password...</span>
    fail_text           = <i>$FAIL <b>($ATTEMPTS)</b></i>

    position            = 0, -75
    halign              = center
    valign              = center
}

