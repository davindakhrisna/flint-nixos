# =============================================================================
# Kitty Terminal Configuration
# Theme: Base16 Monochrome Brutalist
# =============================================================================

# --- Typography ---
font_family      Iosevka Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- Window Layout & Padding ---
window_padding_width 14
placement_strategy   center
remember_window_size no
initial_window_width  960
initial_window_height 600

# --- Transparency & Blur ---
background_opacity 0.85
background_blur    1

# --- Window Behavior & Aesthetics ---
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell       no

# --- Cursor ---
cursor                #ffffff
cursor_text_color     #101010
cursor_shape          block
cursor_blink_interval 0

# --- Shell Integration ---
shell_integration no-rc

# --- Colors: Base16 Monochrome / Grayscale ---
# Matches ~/.config/waybar/colors.css and ~/.config/rofi/colors.rasi
foreground            #dedede
background            #101010
selection_foreground  #ffffff
selection_background  #262626
url_color             #dedede

active_border_color   #ffffff
inactive_border_color #262626

# Normal ANSI Colors
color0  #181818
color1  #a0a0a0
color2  #b4b4b4
color3  #c4c4c4
color4  #dedede
color5  #b0b0b0
color6  #cccccc
color7  #e0e0e0

# Bright ANSI Colors
color8  #505050
color9  #b8b8b8
color10 #c8c8c8
color11 #d8d8d8
color12 #ffffff
color13 #c0c0c0
color14 #e0e0e0
color15 #ffffff
